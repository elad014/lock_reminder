esphome:
  name: lock-reminder
  friendly_name: Lock reminder

esp8266:
  board: esp01_1m

logger:
  baud_rate: 115200

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: lock-reminder

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  ap:
    ssid: lock-reminder
    password: lock-reminder

http_request:
  verify_ssl: false
  timeout: 15s
  tls_buffer_size_rx: 6144
  tls_buffer_size_tx: 1024

binary_sensor:
  - platform: gpio
    id: io2
    pin:
      number: GPIO2
      mode:
        input: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            WiFi.setSleepMode(WIFI_NONE_SLEEP);
        - http_request.post:
            url: https://ep-cool-water-be4054d3.c-9.us-east-2.aws.neon.tech/sql
            request_headers:
              Content-Type: application/json
              Neon-Connection-String: !secret neon_connection_string
            body: >-
              {"query":"WITH updated AS ( UPDATE state SET status = 'Mellon' WHERE ctid = (SELECT ctid FROM state LIMIT 1) RETURNING status ) INSERT INTO state (status) SELECT 'Mellon' WHERE NOT EXISTS (SELECT 1 FROM updated)","params":[]}
            on_response:
              then:
                - logger.log:
                    format: "Neon HTTP %d"
                    args:
                      - response->status_code
        - lambda: |-
            WiFi.setSleepMode(WIFI_LIGHT_SLEEP);
    on_release:
      then:
        - lambda: |-
            WiFi.setSleepMode(WIFI_NONE_SLEEP);
        - http_request.post:
            url: https://ep-cool-water-be4054d3.c-9.us-east-2.aws.neon.tech/sql
            request_headers:
              Content-Type: application/json
              Neon-Connection-String: !secret neon_connection_string
            body: >-
              {"query":"WITH updated AS ( UPDATE state SET status = 'Automate' WHERE ctid = (SELECT ctid FROM state LIMIT 1) RETURNING status ) INSERT INTO state (status) SELECT 'Automate' WHERE NOT EXISTS (SELECT 1 FROM updated)","params":[]}
            on_response:
              then:
                - logger.log:
                    format: "Neon HTTP %d"
                    args:
                      - response->status_code
        - lambda: |-
            WiFi.setSleepMode(WIFI_LIGHT_SLEEP);
